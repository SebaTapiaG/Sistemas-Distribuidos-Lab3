name: CI CivicMesh

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-lint:
    name: Test and Lint Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linting con flake8
        run: |
          # Aborta el build si hay errores de sintaxis o nombres indefinidos
          flake8 civicmesh tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero trata el resto de reglas como advertencias, no bloquean el CI
          flake8 civicmesh tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Pruebas Unitarias
        run: |
          pytest tests/unit/ -v

      - name: Pruebas de Integración
        run: |
          pytest tests/integration/ -v

  docker-build:
    name: Docker Build & Compose Smoke Test
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker compose build

      - name: Levantar malla (3 peers + publicador + frontend)
        run: |
          docker compose up -d
          echo "Esperando a que los servicios inicien..."
          sleep 15

      - name: Verificar que los contenedores siguen corriendo
        run: |
          docker compose ps
          # docker compose ps siempre imprime la fila de encabezado, incluso sin
          # coincidencias — por eso usamos --quiet (solo IDs, vacío si no hay
          # ninguno) en vez de contar líneas de la salida con formato tabla.
          EXITED_IDS=$(docker compose ps --status exited --quiet)
          if [ -n "$EXITED_IDS" ]; then
            echo "Uno o más servicios de la malla terminaron inesperadamente:"
            docker compose ps --status exited
            docker compose logs
            exit 1
          fi

      - name: Verificar frontend responde en :8501
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "Frontend OK"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend no respondió a tiempo"
          docker compose logs frontend
          exit 1

      - name: Logs de la malla (siempre, para debugging)
        if: always()
        run: docker compose logs

      - name: Apagar malla
        if: always()
        run: docker compose down -v